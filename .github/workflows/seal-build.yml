# Sealed build of org.eclipse.jetty.ee10:jetty-ee10-proxy.
# Upstream builds and tests on Jenkins (Jenkinsfile: "mvn -Pci clean install" on jdk17/21/25);
# its only GitHub workflows are CodeQL (no tests) and a stale-issue bot.
# This workflow mirrors the Jenkins "-Pci clean install" on GitHub runners, scoped to the
# jetty-ee10-proxy module (+ its reactor dependencies) and to the modules whose tests cover
# the paths the security patches touch (ee9/ee11 proxy, ee9/ee10/ee11 servlets, jetty-server, jetty-util).
name: "Seal build"

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional surefire -Dtest selector; empty runs the full suite of every leg"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  MAVEN_OPTS: "-Djava.awt.headless=true -Xmx4G -Xms1G"
  # -Pci = upstream Jenkins profile (excludedGroups external/large-disk-resource/stress/slow/flaky,
  # surefire.rerunFailingTestsCount=1). .mvn/maven.config enables remote-repository filters whose
  # .mvn/rrf allow-lists ship empty; CLI properties override them. JUnit parallel class execution
  # is switched off (serial still runs every test) and a per-test timeout turns a hang into a
  # named failure.
  COMMON_ARGS: >-
    -B -e -V -ntp -Pci
    -Daether.remoteRepositoryFilter.groupId=false
    -Daether.remoteRepositoryFilter.prefixes=false
    -Djunit.jupiter.execution.parallel.enabled=false
    -Djunit.jupiter.execution.timeout.default=5m
    -Dspotbugs.skip=true -Djacoco.skip=true -Dcheckstyle.skip=true -Denforcer.skip=true
    -Dlicense.skip=true -Dmaven.javadoc.skip=true -Dgpg.skip=true

jobs:
  build:
    name: ${{ matrix.leg }} (JDK ${{ matrix.jdk }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          # Release leg: published jar MANIFEST says Build-Jdk-Spec 25 (Jenkins release = jdk25).
          - leg: ee10-proxy
            jdk: "25"
            build: jetty-ee10/jetty-ee10-proxy
            test: jetty-ee10/jetty-ee10-proxy
            artifacts: true
          - leg: ee10-proxy
            jdk: "21"
            build: jetty-ee10/jetty-ee10-proxy
            test: jetty-ee10/jetty-ee10-proxy
          - leg: ee10-proxy
            jdk: "17"
            build: jetty-ee10/jetty-ee10-proxy
            test: jetty-ee10/jetty-ee10-proxy
          - leg: ee9-ee11-proxy
            jdk: "25"
            build: "jetty-ee9/jetty-ee9-proxy,jetty-ee11/jetty-ee11-proxy"
            test: "jetty-ee9/jetty-ee9-proxy,jetty-ee11/jetty-ee11-proxy"
          - leg: servlets
            jdk: "25"
            build: "jetty-ee9/jetty-ee9-servlets,jetty-ee10/jetty-ee10-servlets,jetty-ee11/jetty-ee11-servlets"
            test: "jetty-ee9/jetty-ee9-servlets,jetty-ee10/jetty-ee10-servlets,jetty-ee11/jetty-ee11-servlets"
          # jetty-server: plain socket reads ignore interrupts, so the JUnit timeout needs its own thread.
          - leg: jetty-server
            jdk: "25"
            build: jetty-core/jetty-server
            test: jetty-core/jetty-server
            extra: "-Djunit.jupiter.execution.timeout.thread.mode.default=SEPARATE_THREAD"
          - leg: jetty-util
            jdk: "25"
            build: jetty-core/jetty-util
            test: jetty-core/jetty-util

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}

      - name: Prepare Mimir
        shell: bash
        run: |
          mkdir -p ~/.mimir
          cp .github/ci-mimir-daemon.properties ~/.mimir/daemon.properties

      - name: Set up Maven
        run:
          mvn -e -B -V org.apache.maven.plugins:maven-wrapper-plugin:3.3.2:wrapper "-Dmaven=3.9.14"

      - name: Build reactor dependencies (tests run in the next step)
        run: |
          ./mvnw clean install $COMMON_ARGS -pl '${{ matrix.build }}' -am -DskipTests

      - name: Test ${{ matrix.leg }}
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          FILTER_ARGS=""
          if [ -n "$TEST_FILTER" ]; then
            FILTER_ARGS="-Dtest=$TEST_FILTER -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false"
          fi
          ./mvnw install $COMMON_ARGS ${{ matrix.extra }} $FILTER_ARGS -pl '${{ matrix.test }}'

      - name: List test results and skipped tests with reasons
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, os, re, xml.etree.ElementTree as ET
          # A bare JUnit "Assumption failed" message carries no cause, so look up the
          # assume*(...) conditions in the test method's source and print them as the reason.
          _src = {}
          def assumptions(classname, testname, trace):
              top = classname.split("$")[0]
              if top not in _src:
                  hits = glob.glob("**/src/test/java/" + top.replace(".", "/") + ".java", recursive=True)
                  _src[top] = open(hits[0], encoding="utf-8").read().splitlines() if hits else []
              lines = _src[top]
              m = re.search(r"\(" + re.escape(top.rsplit(".", 1)[-1]) + r"\.java:(\d+)\)", trace)
              if m and 0 < int(m.group(1)) <= len(lines):
                  return lines[int(m.group(1)) - 1].strip()
              method = testname.split("(")[0].split("[")[0].strip()
              start = next((i for i, l in enumerate(lines) if re.search(r"\bvoid\s+" + re.escape(method) + r"\s*\(", l)), None)
              if start is None:
                  return ""
              found = []
              for i in range(max(0, start - 6), min(len(lines), start + 120)):
                  l = lines[i]
                  if i > start and re.search(r"\bvoid\s+\w+\s*\(", l):
                      break
                  if "assume" in l or "@Disabled" in l or "@DisabledOn" in l or "@EnabledOn" in l:
                      found.append(l.strip())
              return " | ".join(found)
          modules = {}
          total = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          skipped = []
          for f in sorted(glob.glob("**/target/surefire-reports/TEST-*.xml", recursive=True)):
              try:
                  root = ET.parse(f).getroot()
              except ET.ParseError:
                  continue
              mod = f.split("/target/surefire-reports/")[0]
              mt = modules.setdefault(mod, {k: 0 for k in total})
              for k in total:
                  v = int(root.get(k, 0) or 0)
                  total[k] += v
                  mt[k] += v
              for tc in root.iter("testcase"):
                  s = tc.find("skipped")
                  if s is not None:
                      full = (s.get('message') or '') + "\n" + (s.text or '')
                      msg = (full.strip().splitlines() or ['no message'])[0].strip()
                      if "assumption is not" in msg or msg == 'no message':
                          cond = assumptions(tc.get('classname'), tc.get('name'), full)
                          if cond:
                              msg = f"REASON: test's own source condition `{cond}` ({msg})"
                      skipped.append(f"{tc.get('classname')}#{tc.get('name')}: {msg}")
          for mod, mt in sorted(modules.items()):
              print(f"MODULE {mod}: tests={mt['tests']} failures={mt['failures']} errors={mt['errors']} skipped={mt['skipped']} passed={mt['tests']-mt['failures']-mt['errors']-mt['skipped']}")
          print(f"Surefire totals: tests={total['tests']} failures={total['failures']} errors={total['errors']} skipped={total['skipped']} passed={total['tests']-total['failures']-total['errors']-total['skipped']}")
          for line in skipped:
              print("SKIPPED", line)
          EOF

      - name: Upload jetty-ee10-proxy artifacts
        if: ${{ matrix.artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: jetty-ee10-proxy-jars
          if-no-files-found: error
          path: |
            jetty-ee10/jetty-ee10-proxy/target/jetty-ee10-proxy-*[0-9].jar
            jetty-ee10/jetty-ee10-proxy/target/jetty-ee10-proxy-*-config.jar
